# Copy this file and pass --config /path/to/config.yml to the server.
version: 1

server:
  port: 3008

database:
  # sqlite | mysql | postgres
  driver: sqlite
  # Relative paths are resolved against this configuration file (sqlite only).
  sqlite_path: starhub.db
  # MySQL/PostgreSQL connection strings (set driver above and uncomment).
  # dsn: "starhub:password@tcp(127.0.0.1:3306)/starhub?charset=utf8mb4&parseTime=True&loc=Local"
  # dsn: "host=127.0.0.1 port=5432 user=starhub password=pass dbname=starhub sslmode=disable"
  # max_open_conns: 25
  # max_idle_conns: 5
  # conn_max_lifetime: 1h

security:
  # Keep this true when TLS terminates at a reverse proxy.
  force_secure_cookie: false

# These values seed only missing database options. Change existing options
# through the management API so updates are versioned and reloaded.
initial_options:
  channel_test_interval: 1800
  task_poll_interval: 60
  cookie_secure: false
  ip_rate_limit: 240
  user_rate_limit: 120
  token_rate_limit: 60
  model_rate_limit: 200
