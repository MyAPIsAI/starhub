# Copy this file and pass --config /path/to/config.yml to the server.
version: 1

server:
  port: 3008

database:
  # Supported single-instance drivers: sqlite, mysql (8.x), postgres (tested on 15).
  driver: sqlite
  # Relative paths are resolved against this configuration file (sqlite only).
  sqlite_path: starhub.db
  # Network drivers require a DSN. Inject credentials through STARHUB_DB_DSN.
  # MySQL requires max_allowed_packet >= 65 MiB; 128 MiB is recommended.
  # dsn: "starhub:password@tcp(127.0.0.1:3306)/starhub?charset=utf8mb4"
  # dsn: "host=127.0.0.1 port=5432 user=starhub password=pass dbname=starhub sslmode=disable"
  # These are the network pool defaults; SQLite ignores pool settings.
  # max_open_conns: 25
  # max_idle_conns: 5
  # conn_max_lifetime: 1h

security:
  # Keep this true when TLS terminates at a reverse proxy.
  force_secure_cookie: false

# These values seed only missing database options. Change existing options
# through the management API so updates are versioned and reloaded.
initial_options:
  channel_test_interval: 1800
  task_poll_interval: 60
  cookie_secure: false
  ip_rate_limit: 240
  user_rate_limit: 120
  token_rate_limit: 60
  model_rate_limit: 200

# Deployment environment:
# The server loads .env from its working directory; nonempty process variables win.
# Development can initialize a persistent secret for credential-free local SQLite.
# Existing encrypted data requires its original secret; production never generates one.
# STARHUB_ENV: set production to reject disposable secrets and weak initial passwords.
# STARHUB_CRYPTO_SECRET: stable secret for customer-key lookup and legacy decryption.
# STARHUB_CREDENTIAL_KEYS / STARHUB_CREDENTIAL_ACTIVE_KEY: versioned wrapping keys.
# STARHUB_ROOT_PASSWORD: initial root password; complete password change and 2FA.
# STARHUB_BIND_ADDRESS: bind to a private or loopback IP behind a TLS proxy.
# STARHUB_TRUSTED_PROXIES: trusted reverse proxy CIDRs, never client-controlled.
# STARHUB_ADMIN_IP_WHITELIST: optional management access CIDRs.
# STARHUB_DB_DRIVER / STARHUB_DB_DSN: override driver and connection string together.
# STARHUB_REGION_PROFILE: deployment-selected regional policy.
# STARHUB_BACKUP_DIR: existing directory for SQLite snapshots.
# STARHUB_BACKUP_INTERVAL / STARHUB_BACKUP_KEEP: opt-in SQLite schedule and retention.
# STARHUB_EMAIL_BRIDGE_URL / STARHUB_EMAIL_BRIDGE_TOKEN: authenticated mail adapter.
# STARHUB_SMS_BRIDGE_URL / STARHUB_SMS_BRIDGE_TOKEN: authenticated SMS adapter.
# Administrators can configure Alibaba Cloud SMS in Account center > Phone > SMS configuration.
# An external STARHUB_SMS_BRIDGE_URL overrides the stored Alibaba Cloud configuration.
# RESOURCE_CATALOG_NOTIFY_URL / NODE_NAME: resource integration and stable node ID.
# See PRODUCTION.md, CREDENTIAL_STORAGE.md and SERVICE_MTLS.md before deployment.
