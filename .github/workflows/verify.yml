name: Verify

on:
  push:
  pull_request:
  schedule:
    # Nightly at 03:00 UTC
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Verify backend without frontend assets
        run: |
          go build ./...
          go vet ./...
          go test ./...
      - name: Verify retrycheck suite (retry, failover, uncertain scenarios)
        run: go test -tags=retrycheck ./e2e -run '^TestRetryCheck' -count=1 -v
      - name: Check Go coverage against threshold
        run: |
          go test ./controller/... ./model/... ./common/... -count=1 \
            -coverprofile=coverage.out -coverpkg=./...
          go tool cover -func=coverage.out | grep "^total:" | \
            awk '{gsub(/%/,"",$3); if ($3+0 < 38.0) { print "FAIL: coverage", $3, "< 38.0%"; exit 1 } else { print "PASS: coverage", $3, ">= 38.0%" }}'
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Verify and build console
        working-directory: web
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm run test:unit
          npm run build
      - name: Verify embedded console
        run: |
          go build -tags frontend ./...
          go vet -tags frontend ./...
          go test -tags frontend ./...
      - name: Install test browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser tests against isolated Go server
        working-directory: web
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            web/playwright-report/
            web/test-results/

  # Nightly job: shuffle tests to detect order-dependent failures.
  # Only runs on schedule (not on every push/PR).
  nightly-shuffle:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Run shuffled tests (3 rounds)
        run: |
          for i in 1 2 3; do
            echo "=== Shuffle run $i/3 ==="
            go test ./... -count=1 -shuffle=on 2>&1 | tee -a shuffle-output.txt
            EXIT=$?
            if [ $EXIT -ne 0 ]; then
              echo "FAIL: shuffle run $i"
              grep -o '\-shuffle=[0-9]*' shuffle-output.txt | tail -1 | \
                xargs -I{} echo "Reproduce: go test ./... -count=1 {}"
              exit 1
            fi
            echo "PASS: shuffle run $i"
          done
          echo "=== All 3 shuffle runs passed ==="

  # Nightly job: race detector. Linux runners have gcc, so
  # CGO_ENABLED=1 works. Only runs on schedule.
  nightly-race:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Run race detector on critical packages
        run: |
          go test -race -count=1 ./controller/... ./model/... ./middleware/... ./service/... ./relay/... ./common/... ./pkg/... ./setting/...
      - name: Run race detector on e2e
        run: |
          go test -race -count=1 ./e2e/
