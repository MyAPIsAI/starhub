name: starhub

services:
  starhub:
    image: ${STARHUB_IMAGE:-starhub:latest}
    platform: ${STARHUB_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    restart: unless-stopped
    stop_grace_period: 55s
    ports:
      - "${STARHUB_HOST_IP:-127.0.0.1}:${STARHUB_HOST_PORT:-3008}:3000"
    volumes:
      - starhub_data:/data
    environment:
      STARHUB_ENV: production
      STARHUB_BIND_ADDRESS: 0.0.0.0
      STARHUB_PORT: "3000"
      STARHUB_DB: /data/starhub.db
      STARHUB_ROOT_PASSWORD: ${STARHUB_ROOT_PASSWORD:-Sh1-add462edd05f813ad9306fbd175130a0}
      STARHUB_CRYPTO_SECRET: ${STARHUB_CRYPTO_SECRET:-131086e93c679949e6d0a679c9b29a222ef99525bf75ae00fe09540ec4ef3030}
      STARHUB_CREDENTIAL_KEYS: ${STARHUB_CREDENTIAL_KEYS:-}
      STARHUB_CREDENTIAL_ACTIVE_KEY: ${STARHUB_CREDENTIAL_ACTIVE_KEY:-}
      STARHUB_COOKIE_SECURE: ${STARHUB_COOKIE_SECURE:-false}
      STARHUB_TRUSTED_PROXIES: ${STARHUB_TRUSTED_PROXIES:-}
      STARHUB_ADMIN_IP_WHITELIST: ${STARHUB_ADMIN_IP_WHITELIST:-}
      STARHUB_REGION_PROFILE: ${STARHUB_REGION_PROFILE:-}
      RESOURCE_CATALOG_NOTIFY_URL: ${RESOURCE_CATALOG_NOTIFY_URL:-http://starhub-resource:3001}
      RESOURCE_CATALOG_NOTIFY_ENABLED: ${RESOURCE_CATALOG_NOTIFY_ENABLED:-1}
      METRIC_AUTHORIZATION: ${METRIC_AUTHORIZATION:-77b447834930dcc552eaa0d75d8673ea38ebf9c7ff78d922d2af790a6f4bce3e}
      ROUTING_PROTECTION_SOURCE: ${ROUTING_PROTECTION_SOURCE:-talen}
      ROUTING_OBSERVATION_V2_ENABLED: ${ROUTING_OBSERVATION_V2_ENABLED:-1}
      NODE_NAME: ${NODE_NAME:-starhub-node-1}
      TZ: ${TZ:-Asia/Shanghai}
    networks:
      default:
        aliases: [starhub-backend]
    healthcheck:
      # Check the database without waiting for a commercial routing snapshot.
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  starhub_data:
